# Local full-stack environment. Secrets come from ./backend/.env (never committed).
# Usage: docker compose up --build
services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: fxrobot
      MYSQL_USER: fxrobot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fxrobot-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fxrobot-root-local-only}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://fxrobot:${MYSQL_PASSWORD:-fxrobot-local-only}@db:3306/fxrobot?charset=utf8mb4
      LOG_FORMAT: json
      # The frontend container is the only proxy; its address is on the compose network.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysqldata:
