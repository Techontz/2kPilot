# Local full-stack environment. Secrets come from ./backend/.env (never committed).
# Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fxrobot
      POSTGRES_USER: fxrobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fxrobot-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxrobot -d fxrobot"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fxrobot:${POSTGRES_PASSWORD:-fxrobot-local-only}@db:5432/fxrobot
      LOG_FORMAT: json
      # The frontend container is the only proxy; its address is on the compose network.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
