[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxrobot"
version = "0.1.0"
description = "2kPilot — isolated trading engine (strategies, risk, execution, brokers, backtesting)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "websockets>=13",
    "anthropic>=1.13,<2",  # optional plain-English strategy drafting (ANTHROPIC_API_KEY)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fxrobot = "fxrobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "RUF001", "RUF002", "RUF003",  # intentional typographic characters (→, ×, —) in messages
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]


[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["fxrobot"]
